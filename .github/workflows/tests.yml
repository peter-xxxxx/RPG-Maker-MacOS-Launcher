name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  translation-tests:
    name: Translation tests (Python + Node)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run test suite
        run: ./scripts/test.sh
        env:
          PYTHON: python

      - name: Check Python syntax
        run: python -m compileall -q main.py translation.py translation_dialog.py tests
